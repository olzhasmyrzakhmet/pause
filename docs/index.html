<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15120e">
<title>Pause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  section { margin-top: 36px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .stats { display: flex; gap: 12px; }
  .stats .box { flex: 1; }
  .big { font-size: 40px; font-weight: 700; letter-spacing: -.03em; }
  textarea { width: 100%; min-height: 110px; background: none; border: 0; outline: none; resize: none; font-size: 20px; }
  .counter { text-align: right; color: var(--muted); font-size: 14px; }
  .apps .cta { margin-bottom: 12px; }
  .set { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .set:last-child { border: 0; }
  .set input { width: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; font-family: var(--mono); }
  #saved { color: var(--yellow); font-size: 14px; margin-left: 12px; }
</style>
</head>
<body>
<h1 style="margin-top:20px">Today</h1>

<section>
  <div class="stats">
    <div class="box"><div class="big" id="st-walked">0</div><label>walked away</label></div>
    <div class="box"><div class="big" id="st-opens">0</div><label>pauses</label></div>
  </div>
</section>

<section class="apps">
  <h2>Open through a pause</h2>
  <button class="cta" data-app="instagram">Instagram</button>
  <button class="cta" data-app="tiktok" style="background:var(--paper)">TikTok</button>
</section>

<section id="intention">
  <h2>Note to self</h2>
  <div class="box">
    <textarea id="note" maxlength="200" placeholder="Who do you want to be?"></textarea>
    <div class="counter"><span id="len">0</span> / 200</div>
  </div>
  <h2 style="margin-top:18px">Or borrow one</h2>
  <div class="row" id="borrow"></div>
  <div style="margin-top:18px;display:flex;align-items:center">
    <button class="cta" id="save" style="width:auto;padding:14px 32px">Save</button><span id="saved"></span>
  </div>
</section>

<section>
  <h2>Pause screen</h2>
  <div class="box">
    <div class="set"><span>Wait before "Yes" (sec)</span><input type="number" min="0" id="waitSec"></div>
    <div class="set"><span>+ each open today (sec)</span><input type="number" min="0" id="growSec"></div>
    <div class="set"><span>Locked after, for (min)</span><input type="number" min="0" id="lockMin"></div>
  </div>
</section>

<script type="module">
import { load, save, dayKey } from "./store.js";
const $ = (id) => document.getElementById(id);
const s = load();

const today = s.log.filter((e) => dayKey(e.t) === dayKey(Date.now()));
$("st-walked").textContent = today.filter((e) => e.action === "closed").length;
$("st-opens").textContent = today.filter((e) => e.action === "open").length;

document.querySelectorAll("[data-app]").forEach((b) => b.onclick = () => {
  location.href = `pause.html?app=${b.dataset.app}`;
});

const note = $("note");
note.value = s.intention; $("len").textContent = note.value.length;
note.oninput = () => { $("len").textContent = note.value.length; $("saved").textContent = ""; };
const pool = ["reads more", "present with my friends", "not anxious all the time", "a maker", "sleeps before 1am",
  "studies when I said I would", "calls home more", "moves every day", "finishes what I start", "notices the day"];
const shuffle = () => {
  const pick = [...pool].sort(() => Math.random() - .5).slice(0, 4);
  $("borrow").replaceChildren(...pick.map((t) => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = t;
    b.onclick = () => { note.value = t; note.oninput(); }; return b;
  }), Object.assign(document.createElement("button"), { className: "chip", textContent: "Shuffle", onclick: shuffle }));
};
shuffle();
$("save").onclick = () => {
  const v = note.value.trim();
  if (v !== s.intention) { s.intention = v; s.intentionAt = Date.now(); }
  save(s); $("saved").textContent = v ? "Saved" : "Cleared";
};

for (const k of ["waitSec", "growSec", "lockMin"]) {
  $(k).value = s[k];
  $(k).onchange = () => { s[k] = Math.max(0, Math.round(+$(k).value || 0)); $(k).value = s[k]; save(s); };
}
</script>
</body>
</html>
